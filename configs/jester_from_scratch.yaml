# Jester -> Jarvis dynamic gesture pretraining, entirely from random weights.
data:
  downloads: data/raw/jester/downloads
  metadata: data/raw/jester/metadata/jester_labels
  frames_root: data/raw/jester/frames/20bn-jester-v1
  manifest: data/splits/jester/manifest.jsonl
  clip_len: 16
  frame_size: 112
  resize_size: 128
  max_decode_error_rate: 0.005

train:
  seed: 42
  batch_size: 32
  effective_batch_size: 32
  epochs: 30
  benchmark_epochs: 2
  benchmark_samples_per_class: 160
  learning_rate: 0.0005
  weight_decay: 0.0001
  label_smoothing: 0.05
  warmup_epochs: 2
  patience: 6
  amp: true
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  max_vram_ratio: 0.86

models:
  candidates:
    - tiny_3d_cnn
    - cnn_bigru
    - mobilenet_tsm_attention
  winner: null
  dropout: 0.25

paths:
  runs: training_workspace/jester/runs
  reports: reports/jester
  export: training_workspace/jester/export

evaluation:
  selection_metric: macro_f1
  final_split: test
  negative_labels:
    - No gesture
    - Doing other things
