# Jarvis configuration. See README.md for the full guide.
#
# Tune here, never in code. Module sections feed core.config_loader.ModuleConfig
# (fields: enabled, device, compute_type, model, params).

orchestrator:
  listening_timeout_seconds: 10  # bounds initial and active-session listening
  interaction_timeout_seconds: 60 # hard failure guard; completion is event-driven

modules:
  # Gesture Core uses the frozen TSN-ResNet18 baseline in a restricted
  # real-camera test: only six reversible media actions may execute.
  gesture:
    enabled: true
    device: "cuda"
    model: checkpoints/tsn_resnet18_seed42/best.pt
    params:
      quality_report: reports/evaluation_test.json
      checkpoint_sha256: 79ce0465bc705180a3beacba42436bdf9a23e693d2a2d143de40631f3c61a0c9
      allow_unapproved_observer: true
      camera_index: 0
      # DirectShow avoids slow/hanging CAP_ANY probing on Windows webcams.
      camera_backend: dshow
      preview_enabled: true
      preview_window: Jarvis Gesture Core
      # Global toggle is active only while Jarvis itself is running.
      toggle_hotkey: "<ctrl>+<alt>+/"
      camera_start_timeout: 8.0
      log_dir: logs/gestures
      log_retention_days: 30
      log_max_bytes: 104857600
      log_file_max_bytes: 10485760
      # Uniformly sample 16 frames from a rolling three-second camera window.
      frames: 16
      window_frames: 90
      image_size: 112
      resize_size: 128
      window_stride: 8
      confidence_threshold: 0.7
      consecutive_windows: 3
      cooldown_seconds: 1.5
      # A triggered gesture cannot fire again until D0X is observed.
      require_neutral_rearm: true
      armed_on_start: false
      # Restricted real-camera test: only six reversible media actions execute.
      # Every other class remains observer-only despite execution_enabled=true.
      action_allowlist: [G01, G02, G03, G04, G05, G06]
      observer_action_allowlist: [G01, G02, G03, G04, G05, G06]
      execution_enabled: true

  wake_word:
    enabled: true
    # Local openWakeWord listens for "Hey Jarvis"; Ctrl+Alt+Space remains a fallback.
    device: cpu
    params:
      wake_phrase_enabled: true
      wake_phrase_model: hey_jarvis
      # "Jarvis" is detected acoustically by openWakeWord. The Russian
      # aliases are also understood whenever a voice session is listening;
      # dedicated always-on acoustic weights will be added during wake-model training.
      wake_phrase_aliases: ["Jarvis", "Железяка проснись", "Доброе утро"]
      wake_acknowledgement_enabled: true
      wake_acknowledgements:
        - "К вашим услугам, сэр"
        - "Что прикажете делать?"
      # Balanced for laptop microphone arrays. Candidate scores are logged so
      # this can be tuned per microphone without guessing.
      wake_phrase_threshold: 0.35
      wake_phrase_frames: 1
      wake_phrase_vad_threshold: 0.3
      wake_phrase_auto_download: true
      # After every successful voice turn, listen for another command without
      # requiring the wake phrase again. Silence returns Jarvis to sleep mode.
      active_session_enabled: true
      active_session_timeout_seconds: 7
      hotkey: "<ctrl>+<alt>+<space>"

  # Official OpenAI Whisper (no Hugging Face dependency or endpoint).
  stt:
    enabled: true
    # Uses CUDA + FP16 when PyTorch sees an NVIDIA GPU, otherwise CPU + FP32.
    device: "auto"
    model: "small"
    params:
      language: ru
      download_root: models/openai-whisper
      # Bias mixed Russian/English application names without changing the
      # Russian recognition language. This is a prompt, not another model.
      initial_prompt: >-
        Команды голосового ассистента Джарвис. Приложения: калькулятор,
        блокнот, проводник, Paint, Пейнт, Discord, Дискорд, диспетчер задач,
        браузер.

  # Own character-level NLU manager. It routes tool/control/dialogue/reject,
  # then predicts intent and slots. All weights and its tokenizer are trained
  # locally from random initialisation; no pretrained checkpoints are used.
  nlu:
    enabled: true
    device: cpu
    model: models/nlu_manager_finetuned.pt
    params:
      confidence_threshold: 0.55

  # Ollama qwen2.5:7b-instruct. Full 7B GPU offload will NOT fit in 3GB;
  # run on CPU, or use Q4_K_M / smaller. See README §3.
  llm:
    enabled: true
    device: "cpu"
    compute_type: q4_k_m
    model: "qwen2.5:7b-instruct"
    params:
      # The NLU model owns tool routing. Ollama handles only general dialogue;
      # deterministic tool results are returned directly.
      input_event: nlu_result
      # Probe while the heavier voice models load in parallel. If Ollama is
      # offline, the first chat turn falls back immediately instead of waiting
      # for a connection timeout.
      probe_on_start: true

  # Silero TTS. Light; CPU is fine, no GPU contention with STT/LLM.
  tts:
    enabled: true
    device: cpu
    model: v4_ru
    params:
      language: ru
      speaker: xenia
      sample_rate: 48000
      # Silero lazily initializes expensive CPU kernels on its first calls.
      # Warm them while Whisper loads in parallel, then cache short repeated
      # confirmations so the first spoken response is not the slowest one.
      prewarm_enabled: true
      prewarm_texts:
        - "Открываю Браузер."
        - "Открываю Дискорд."
        - "К вашим услугам, сэр"
        - "Что прикажете делать?"
      cache_max_entries: 16
      cache_max_chars: 120

memory:
  db_path: memory.db            # long-term SQLite store
  short_term_turns: 8           # rolling conversational window size
  max_facts: 500                # explicit facts per user profile; never silently evicted
  max_fact_chars: 500           # rejects accidental transcripts or oversized secrets
  context_facts: 6              # bounded local-memory facts added to free dialogue
  context_chars: 1200           # hard prompt-size cap for those facts

reminders:
  db_path: reminders.db
  profile_id: default
  poll_interval_seconds: 0.5

profiles:
  # Empty means %APPDATA%\Jarvis\profiles. JARVIS_DATA_DIR overrides it.
  root: ""

feedback:
  # Local only: uncertain/failed NLU turns wait for human review. No audio is
  # stored and the model is never retrained automatically on predictions.
  enabled: true
  queue_path: data/feedback/pending.jsonl
  min_intent_confidence: 0.72
  capture_tool_failures: true
  max_queue_bytes: 5000000

logging:
  level: "INFO"
  log_file: logs/jarvis.log     # parsed by scripts/analyze_latency.py
  # Every start also gets its own UTF-8 transcript for ML feedback. Unlike
  # jarvis.log, these files are never overwritten by the next session.
  session_log_dir: logs/sessions
  console: true

tools:
  # tools auto-discover from tools/ at startup; nothing to list here.
  auto_discover: true
